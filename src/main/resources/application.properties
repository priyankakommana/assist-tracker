spring.application.name=assist-tracker
server.port=8080
spring.datasource.url=jdbc:h2:file:./data/assistdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.jakarta.persistence.jdbc.url=jdbc:h2:file:./data/assistdb
spring.jpa.properties.jakarta.persistence.jdbc.user=sa
spring.jpa.properties.jakarta.persistence.jdbc.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=priyankaxxxxx@gmail.com
spring.mail.password=xxxxxxxxxxxx
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.from=pxxxxxxxxxx@gmail.com
spring.mail.properties.mail.smtp.localhost=localhost

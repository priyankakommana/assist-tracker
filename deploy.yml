- hosts: ec2
  become: yes
  tasks:
    - name: Backup existing data before deploy
      shell: |
        docker cp assist-app:/app/data /tmp/data-backup 2>/dev/null || true
        mkdir -p /opt/assist-data
        cp -r /tmp/data-backup/* /opt/assist-data/ 2>/dev/null || true
        echo "backup done"

    - name: Install Docker
      apt:
        name: docker.io
        state: present
        update_cache: yes

    - name: Start Docker service
      service:
        name: docker
        state: started
        enabled: yes

    - name: Copy project to server
      copy:
        src: ./
        dest: /opt/assist-tracker
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Build Docker image (without AdminFix)
      shell: |
        cd /opt/assist-tracker
        docker build -t assist-tracker .

    - name: Run app container with PERMANENT volume
      shell: |
        docker rm -f assist-app || true
        docker run -d --name assist-app -p 8080:8080 -v /opt/assist-data:/app/data --restart unless-stopped assist-tracker
        sleep 8
        docker logs assist-app --tail 30
      register: logs

    - debug:
        var: logs.stdout_lines